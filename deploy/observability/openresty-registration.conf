# 可选 OpenResty 增强版。普通 Nginx 不支持 Lua，请勿直接套用。
# http {} 中使用上一份配置的 map，并替换 log_format 为：
# log_format matrix_registration escape=json
#   '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
#   '"path":"$uri","status":$status,"user_id":"$registration_user_id"}';
# 以下内容合并到现有 Matrix server {}，沿用现有 TLS 和其他 location。
set $registration_user_id "";
access_log /var/log/nginx/registration.jsonl matrix_registration if=$log_matrix_registration;
location ~ ^/_matrix/client/(v3|r0)/register$ {
    proxy_pass http://tuwunel:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    body_filter_by_lua_block {
        -- 只在成功注册时读取响应中的 user_id，绝不把响应正文写入日志。
        -- 原响应块原样发给客户端；缓冲只用于解析，最多 32 KiB。
        if ngx.req.get_method() ~= "POST" or (ngx.status ~= 200 and ngx.status ~= 201) then return end
        if ngx.ctx.registration_too_large then return end
        local chunk = ngx.arg[1] or ""
        local size = (ngx.ctx.registration_size or 0) + #chunk
        if size > 32768 then
            ngx.ctx.registration_body = nil
            ngx.ctx.registration_too_large = true
            return
        end
        ngx.ctx.registration_size = size
        ngx.ctx.registration_body = (ngx.ctx.registration_body or "") .. chunk
        if ngx.arg[2] then
            local body = require("cjson.safe").decode(ngx.ctx.registration_body)
            if type(body) == "table" and type(body.user_id) == "string" and #body.user_id <= 1024 then
                ngx.var.registration_user_id = body.user_id
            end
            ngx.ctx.registration_body = nil
        end
    }
}
