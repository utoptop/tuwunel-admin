# 普通 Nginx：放入 http {}，把 access_log 加到 Matrix 的 server {}。
# 仅记录注册 POST，不记录查询参数、请求正文、Authorization 或响应正文。
map "$request_method:$uri" $log_matrix_registration {
    default 0;
    ~^POST:/_matrix/client/(v3|r0)/register$ 1;
}
log_format matrix_registration escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status}';
# 在 Matrix server {} 内启用：
# access_log /var/log/nginx/registration.jsonl matrix_registration if=$log_matrix_registration;
# 此格式可统计成功/拒绝/认证挑战/限流，但没有 user_id，不能关联账号创建 IP。
