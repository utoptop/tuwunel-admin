# 复制为 config.toml 后编辑。全部运行设置来自此文件，不读取 .env。
# 相对目录均以配置文件所在目录为基准。修改后重启服务。
[server]
listen = "0.0.0.0:8080"
public_url = "http://localhost:8080"
cookie_secure = false # HTTPS 部署请改为 true
static_dir = "./dist"

[matrix]
# 部署者在此决定固定服务器或开放自定义地址；网页不提供锁定开关。
# locked=true：只显示固定服务器，后端强制只能连接 homeserver。
# locked=false：允许使用面板的人输入自己的服务器；homeserver 可作为默认值。
locked = false
homeserver = ""
# 非空时只允许这些地址及上面的默认地址；空列表允许任意公网 HTTPS。
# 显式列入的地址或默认地址可使用内网 HTTP，例如 http://tuwunel:8008。
allowed_homeservers = []

[auth]
# 默认自动检测密码 / SSO / OAuth。HTTPS auth 地址通过公网 DNS 防护验证。
# 独立内网认证服务的精确 origin 要在这里明确允许；这不增加可登录的 Matrix 服务器。
allowed_origins = []
# OAuth 默认使用自动注册的公共 PKCE 客户端，客户端 ID 会保存在数据卷。
# 若服务器关闭动态注册，可配置预注册的公共客户端（token_endpoint_auth_method=none）。
# 回调地址必须是 <server.public_url>/api/auth/callback。
# [[auth.clients]]
# issuer = "https://auth.example.com/"
# client_id = "your-public-client-id"

[storage]
data_dir = "./data"
# 可选：存放 32 字节原始密钥的文件路径。留空沿用数据卷 encryption.key。
encryption_key_file = ""

[limits]
session_hours = 12
login_attempts = 10
login_window_seconds = 600
max_sessions = 1024
request_timeout_seconds = 30
max_response_bytes = 8388608

[scheduler]
enabled = true
poll_seconds = 60

[bridges]
# 自动识别 @signal_<UUID> 和 @telegram_<数字>，仅用于分类，清理仍需预览并确认。
detect_common = true
# 其他桥接或自定义 bot 前缀按精确服务器隔离；无需填写桥接的密钥。
# [[bridges.rules]]
# homeserver = "https://matrix.example.com"
# name = "Telegram bot"
# user_prefix = "@telegrambot"

# 可选：运行指标 / 只读配置 / 注册 IP 审计。仅匹配当前登录服务器的采集来源可见。
# [[observability.sources]]
# homeserver = "https://matrix.example.com"
# snapshot_file = "/app/observability/server.json"
