# 复制为 config.toml 后编辑。全部运行设置来自此文件，不读取 .env。
# 相对目录均以配置文件所在目录为基准。修改后重启服务。
[server]
listen = "0.0.0.0:8080"
public_url = "http://localhost:8080"
cookie_secure = false # HTTPS 部署请改为 true
static_dir = "./dist"

[matrix]
# locked=true：登录页只读，后端强制只能连接 homeserver。
# locked=false：登录页允许自定义输入；homeserver 作为默认值，可以留空。
locked = false
homeserver = ""
# 非空时只允许这些地址及上面的默认地址；空列表允许任意公网 HTTPS。
# 显式列入的地址或默认地址可使用内网 HTTP，例如 http://tuwunel:8008。
allowed_homeservers = []

[storage]
data_dir = "./data"
# 可选：存放 32 字节原始密钥的文件路径。留空沿用数据卷 encryption.key。
encryption_key_file = ""

[limits]
session_hours = 12
login_attempts = 10
login_window_seconds = 600
max_sessions = 1024
request_timeout_seconds = 30
max_response_bytes = 8388608

[scheduler]
enabled = true
poll_seconds = 60
