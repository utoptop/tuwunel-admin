services:
  tuwunel-admin:
    image: utoptop/tuwunel-admin:1.0
    container_name: tuwunel-admin
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - admin-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  admin-data:
